let t=0,playing=false,started=false,last=performance.now(),test=false;function resize(){let r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);render(t)}function seek(x){t=cl(+x,0,D);last=performance.now();render(t);$('seek').value=t;$('time').textContent=t.toFixed(1)+' / 26.0'}function sync(){$('play').textContent=playing?'暂停':'播放'}function begin(){started=true;$('start').style.display='none';seek(0);playing=true;sync()}function toggle(){if(!started)return begin();if(t>=D)seek(0);playing=!playing;last=performance.now();sync()}function tick(now){let dt=cl((now-last)/1000,0,.1);last=now;if(playing&&!test){seek(t+dt);if(t>=D){playing=false;sync()}}requestAnimationFrame(tick)}$('go').onclick=begin;$('play').onclick=toggle;$('restart').onclick=begin;$('seek').oninput=e=>seek(e.target.value);$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('stage').requestFullscreen?.();addEventListener('resize',resize);addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();toggle()}if(e.code==='ArrowRight')seek(t+1);if(e.code==='ArrowLeft')seek(t-1)});let idle;const reveal=()=>{$('controls').classList.add('show');clearTimeout(idle);idle=setTimeout(()=>$('controls').classList.remove('show'),1800)};$('stage').addEventListener('pointermove',reveal);window.previewAt=x=>{test=true;playing=false;$('start').style.display='none';$('controls').classList.remove('show');seek(x);sync()};resize();requestAnimationFrame(tick);

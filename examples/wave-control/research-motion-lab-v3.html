const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),mix=(a,b,t)=>a+(b-a)*t,ease=u=>{u=cl(u);return u*u*(3-2*u)},ph=(t,a,d)=>ease((t-a)/d),rand=i=>{let a=Math.sin(i*127.1+311.7)*43758.5453;return a-Math.floor(a)};

function forces(c,t){background(c,t);const a=snap(t,13,.4),b=snap(t,14.7,.4),d=snap(t,16.2,.4);let focus=snap(t,16.15,.48);let cx=630-82*focus,cy=349;const ang=-.13+.025*Math.sin(t*1.4);ship(c,0,cx,cy,1.62+.09*snap(t,13,.5)+.14*focus,ang,true);for(let j=0;j<9;j++){let y=160+j*48;path(c,Array.from({length:32},(_,i)=>[280+i*23,y+5*Math.sin(i*.4-t*3+j)]),'#b8d1aa29')}
const A=[cx,cy];alpha(c,a,()=>{arrow(c,A,[cx+340*Math.cos(ang),cy+340*Math.sin(ang)],C.hi,2.4);tx(c,'X',985,cy-52,32,C.hi,true);tx(c,'纵向力',985,cy-23,17);tx(c,'低速下预测更困难',985,cy+3,14,C.mut)});alpha(c,b,()=>{arrow(c,A,[cx+145*Math.sin(ang),cy-145*Math.cos(ang)],C.hi,2.4);tx(c,'Y / 横向力',520,195,22,C.hi,true,'center');tx(c,'总体预测优于纵向力',520,170,14,C.mut,false,'center')});alpha(c,d,()=>{c.strokeStyle=C.warm;c.lineWidth=3;c.beginPath();c.arc(cx,cy,116,.15,2.15);c.stroke();let x=cx+116*Math.cos(2.15),y=cy+116*Math.sin(2.15);arrow(c,[x+13,y+5],[x,y],C.warm,2);tx(c,'N / 艏摇力矩',410,514,25,C.warm,true);tx(c,'总体预测精度更差',410,542,16,C.white)});mark(c,'CONCLUSIONS / pp.383–384',48,116);tx(c,'不同载荷分量，预测难度不同',48,153,29,C.white,true);tx(c,'箭头为分量示意；不表示实测方向或大小',48,617,14,C.mut)}

const beats=[[0,'ARCHIVE','2018 国际基准研究'],[2.4,'HULL FORMS','两个研究对象，不同船型与尺度'],[6,'EXPERIMENT','实际模型尺度与试验对象'],[9.15,'COVERAGE','比较范围：载荷与操纵运动'],[13,'LOAD COMPONENTS','研究结论：不同分量的预测精度有差异'],[18.25,'MANOEUVRE','自由操纵基准工况'],[22,'RESEARCH QUESTION','面向控制的后续研究问题']];
const scenes=[doc,vessels,tank,matrix,forces,zigzag,question];
function chrome(c,t,i){let gr=c.createLinearGradient(0,0,0,94);gr.addColorStop(0,'#06110ef5');gr.addColorStop(1,'#06110e00');rect(c,0,0,W,94,gr);mark(c,'SCENEBRIEF / RESEARCH LAB 03',42,32);text(c,beats[i][1],42,55,12,C.mut,false,'left',true);text(c,'SHIGUNOV ET AL. 2018 / DOI 10.1016/j.oceaneng.2018.07.031',1238,32,11,C.mut,false,'right',true);tx(c,i===6?'后续研究构想':'真实题录与数据 · 原创示意图',1238,55,12,C.mut,false,'right');line(c,[42,68],[1238,68],C.grid);let b=c.createLinearGradient(0,635,0,720);b.addColorStop(0,'#06110e00');b.addColorStop(.45,'#06110eea');b.addColorStop(1,'#06110efb');rect(c,0,635,W,85,b);tx(c,beats[i][2],42,675,23,C.white,true);text(c,`0${i+1} / 07`,1238,674,13,C.hi,false,'right',true);for(let k=0;k<7;k++)rect(c,42+24*k,694,18,2,k===i?C.hi:k<i?'#7e9b79':'#3b5747');rect(c,0,716,W*t/D,2,C.hi)}
function shipPositions(i,t){if(i===1)return [[0,400,280,1.62,0],[1,400,492,1.62,0]];if(i===2)return [[0,672,364.6,.95,.08]];if(i===3)return [[0,166,316,.62,0],[1,166,445,.62,0]];if(i===4)return [[0,630-82*snap(t,16.15,.48),349,1.62+.09*snap(t,13,.5)+.14*snap(t,16.15,.48),-.13+.025*Math.sin(t*1.4)]];if(i===5)return [[1,495+100*ease((t-18.25)/3.6),335,1.32,mix(0,-PI/18,ease((t-18.55)/1.45))+snap(t,20,.35)*.11*ease((t-20.25)/1.5)]];return []}
function render(t){g.save();g.setTransform(cv.width/W,0,0,cv.height/H,0,0);let i=0;while(i+1<beats.length&&t>=beats[i+1][0])i++;const at=beats[i][0],prev=shipPositions(i-1,at-.001),next=shipPositions(i,t),shared=next.filter(n=>prev.some(p=>p[0]===n[0]));const bridge=i>0&&t<at+.48&&shared.length>0;
skipShips=bridge;scenes[i](g,t);
if(i>0&&t<at+.24){let p=snap(t,at,.24);alpha(g,1-p,()=>{g.save();g.translate(W/2,H/2);g.scale(1+.07*p,1+.07*p);g.translate(-W/2,-H/2);scenes[i-1](g,at-.001);g.restore()})}skipShips=false;
if(bridge){const p=snap(t,at,.48);for(const n of next){const old=prev.find(v=>v[0]===n[0]);if(old){const a=n.map((v,k)=>k===0?v:mix(old[k],v,p));ship(g,...a,i===4)}else alpha(g,p,()=>ship(g,...n,i===4))}for(const old of prev)if(!next.some(n=>n[0]===old[0]))alpha(g,1-p,()=>ship(g,...old));}
chrome(g,t,i);g.restore()}

let t=0,playing=false,started=false,last=performance.now(),test=false;function resize(){let r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);render(t)}function seek(x){t=cl(+x,0,D);last=performance.now();render(t);$('seek').value=t;$('time').textContent=t.toFixed(1)+' / 25.0'}function sync(){$('play').textContent=playing?'暂停':'播放'}function begin(){started=true;$('start').style.display='none';seek(0);playing=true;sync()}function toggle(){if(!started)return begin();if(t>=D)seek(0);playing=!playing;last=performance.now();sync()}function tick(now){let dt=cl((now-last)/1000,0,.1);last=now;if(playing&&!test){seek(t+dt);if(t>=D){playing=false;sync()}}requestAnimationFrame(tick)}$('go').onclick=begin;$('play').onclick=toggle;$('restart').onclick=begin;$('seek').oninput=e=>seek(e.target.value);$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('stage').requestFullscreen?.();addEventListener('resize',resize);addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();toggle()}if(e.code==='ArrowRight')seek(t+1);if(e.code==='ArrowLeft')seek(t-1)});let idle;const reveal=()=>{$('controls').classList.add('show');clearTimeout(idle);idle=setTimeout(()=>$('controls').classList.remove('show'),1800)};$('stage').addEventListener('pointermove',reveal);window.previewAt=x=>{test=true;playing=false;$('start').style.display='none';$('controls').classList.remove('show');seek(x);sync()};resize();requestAnimationFrame(tick);

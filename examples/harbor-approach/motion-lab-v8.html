</style></head><body><main id="stage"><canvas id="base"></canvas><div id="grain"></div><div id="start"><small>SCENEBRIEF / MOTION LAB 01</small><h1>四拖轮调度</h1><p>连续动态构图 · 18.5 秒 · V8</p><button id="go">▶ 播放实验（含音效）</button></div><div id="controls"><button id="play" aria-label="暂停">Ⅱ</button><button id="restart" aria-label="重播">↺</button><input id="seek" aria-label="播放进度" type="range" min="0" max="18.5" value="0" step="0.01"><span id="time">0.0 / 18.5 s</span><button id="mute">音效 开</button><button id="voice">旁白 开</button><input id="volume" aria-label="音量" type="range" min="0" max="1" step="0.01" value="0.55" style="flex:0 1 60px"><button id="full">全屏</button></div></main><script>const M0=(()=>{

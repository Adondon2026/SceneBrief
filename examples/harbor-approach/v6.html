</style></head><body><main id="stage"><canvas id="base"></canvas><div id="gl"></div><canvas id="ui"></canvas><div id="grain"></div><span id="mode">SIM / SOFTWARE 3D</span><div id="start"><small>MARITIME INTELLIGENCE / OP. 017</small><h1>靠泊行动</h1><p>240 米集装箱船 · 双拖轮辅助靠泊 / 30 秒 · V6</p><button id="go">▶ 播放简报（含音效）</button></div><div id="controls"><button id="play">Ⅱ</button><button id="restart">↺</button><input id="seek" type="range" min="0" max="30" value="0" step="0.01"><span id="time">00:00 / 00:30</span><button id="mute">音效 开</button><input id="volume" aria-label="音量" type="range" min="0" max="1" step="0.01" value="0.55" style="flex:0 1 75px"><button id="full">全屏</button></div></main><script type="module">const D=30;
const cl=(v,a=0,z=1)=>Math.max(a,Math.min(z,v));

function motion(time){let a=pathAt(Math.max(0,time-.025)),b=pathAt(Math.min(D,time+.025)),dt=(Math.min(D,time+.025)-Math.max(0,time-.025))*SIM||1;let s=pathAt(time),fx=(b.x-a.x)/dt,fz=(b.z-a.z)/dt;return {ahead:Math.max(0,(fx*Math.sin(s.yaw)+fz*Math.cos(s.yaw))*1.94384),sway:Math.abs(fx*Math.cos(s.yaw)-fz*Math.sin(s.yaw)),fore:local(s,-18,0,64)[0]+68.2,aft:local(s,-18,0,-64)[0]+68.2,heading:s.yaw*180/Math.PI}}

function vesselShapes(o,isTug=false,wireframe=false){let L=isTug?31:240,B=isTug?10:36,ed=wireframe?'#a0bb8a':'#2b3a33',deck=wireframe?'#283c30':isTug?'#8b9c86':'#829080',hull=wireframe?'#1e342b':isTug?'#394c41':'#485c51';let pts=[[-B*.39,-L*.5],[B*.39,-L*.5],[B*.5,-L*.40],[B*.5,L*.29],[B*.39,L*.42],[0,L*.5],[-B*.39,L*.42],[-B*.5,L*.29],[-B*.5,-L*.4]];let h=isTug?3.1:10;prism(o,pts,0,h,deck,hull,ed);if(isTug){box(o,0,3,6.5,10,h,h+5.0,wireframe?'#293e32':'#b4b9a4','#65736b',ed);for(let x of [-2.25,0,2.25])box(o,x,8.05,1.85,.25,h+2.7,h+4.5,'#253b36','#172820',ed);for(let x of [-3.29,3.29])for(let z of [1,4.5])box(o,x,z,.18,2.8,h+2.7,h+4.5,'#263d38','#172820',ed);for(let x of [-3.6,3.6])for(let z=-9;z<=10;z+=3)box(o,x,z,.13,.13,h,h+1,'#a9b4a0','#536252',ed);box(o,0,3,7.4,10.8,h+5,h+5.6,'#aab19d','#67776b',ed);box(o,0,2,1,1,h+5.6,h+10,'#a2ae93','#586b59',ed);box(o,0,-9,5,4,h,h+2,'#546e58','#3a4e43',ed);for(let x of [-2.1,0,2.1])box(o,x,14.0,2.2,3.1,.6,3.5,'#29302c','#202925',ed);for(let x of [-4.6,4.6])for(let z of [-8,-4,0,4,8])box(o,x,z,.8,2,1,3.2,'#343b34','#232c27',ed);box(o,0,-10,3,3,h+2,h+3.2,'#a2aa91','#546655',ed);return}box(o,0,-93,30,25,h,h+15,wireframe?'#304336':'#bdc4b2','#788a7b',ed);box(o,0,-86,31,3,h+9,h+13,'#243b35','#293c36',ed);box(o,0,-91,32,27,h+15,h+16,'#c4cbb9','#829182',ed);box(o,0,-94,2,2,h+16,h+28,'#a8b89d','#67765f',ed);box(o,0,-94,15,2,h+24,h+25,'#b8c5a9','#7e9175',ed);box(o,9,-105,6,6,h+16,h+24,'#566a59','#374c43',ed);for(let iz=0;iz<8;iz++)for(let ix=0;ix<4;ix++){let z=-68+iz*20,x=-12+ix*8,k=1+(Math.floor(rnd(iz*7+ix)*3));let colors=['#7e8d78','#a0a88d','#596f64','#818b78','#9e9176'];for(let n=0;n<k;n++)box(o,x,z,7.2,18.7,h+n*4,h+(n+1)*4,wireframe?'#273b30':colors[(iz+ix+n)%colors.length],wireframe?'#203129':'#5b6857',ed)}box(o,0,102,7,9,h,h+2,'#a4b39a','#657663',ed);for(let x of [-14,14])for(let z of [-106,93,101])box(o,x,z,2,3,h,h+1.6,'#384a40','#25352d',ed);for(let x of [-17,17])for(let z=-75;z<91;z+=12)box(o,x,z,.7,.9,h,h+1.1,'#a4b09b','#516254',ed)}
function portShapes(){let o={x:0,z:0,yaw:0};box(o,-210,105,280,630,-1,4,'#6e7965','#424f43','#8d9b80');box(o,-78,105,16,630,0,4.4,'#a0a88e','#576854','#a8b39a');for(let z=-175;z<=375;z+=28){box(o,-69,z,1.6,4,0,5,'#303c34','#29372f','#536451');box(o,-82,z,2,2,4,6,'#b9bb9a','#6d775d','#7e896e')}for(let i=0;i<5;i++){let z=-135+i*115;for(let x of [-124,-91])box(o,x,z,3,3,4,44,'#9aab8b','#536b55','#52694f');box(o,-108,z,47,4,41,45,'#a1b08e','#687b5f','#546952');if(z>=0&&z<=250){box(o,-91,z,4,3,44,86,'#a9b591','#718562','#506c55')}else{box(o,-78,z,65,3,43,46,'#a9b591','#718562','#506c55');box(o,-52,z,3,4,40,43,'#829779','#576d58','#4c6351')}}for(let z=-165;z<390;z+=25)for(let x=-280;x<-145;x+=17){if(rnd(z+x)>.28)box(o,x,z,15,20,4,7+rnd(z*x)*6,['#8a967a','#7a8b75','#9b9d82','#687c6a'][Math.floor(rnd(x+z)*4)],'#4c6252','#536450')}}

function studyVisibility(time,start,end){return ease(cl((time-start)/.32))*ease(cl((end-time)/.27))}
function drawAnchoredStudy(ctx,{time,start,end,anchor,paint,title,index,side='right'}){
  const a=studyVisibility(time,start,end);if(a<=0)return false;
  const w=308,h=384,x=(side==='left'?42:930)+(1-a)*(side==='left'?-22:22),y=111;
  const [ax,ay]=anchor,visible=ax>=24&&ax<=1256&&ay>=90&&ay<=548;

    ctx.strokeStyle='#c2d3a4';ctx.lineWidth=1.2;

    ctx.beginPath();ctx.arc(ax,ay,4,0,Math.PI*2);ctx.stroke();
    for(const dx of [-1,1])for(const dy of [-1,1]){

      ctx.moveTo(ax+dx*15,ay+dy*15);ctx.lineTo(ax+dx*8,ay+dy*15);ctx.stroke();

  ctx.strokeStyle='#82977a';ctx.lineWidth=.9;ctx.strokeRect(x+.5,y+.5,w-1,h-1);

  ctx.translate(x,y);ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillStyle='#a6b89d';ctx.font='11px Consolas, monospace';ctx.fillText(index,13,19);

  ctx.restore();ctx.restore();return true;
}


const TUG_STUDY={start:8.25,end:11.72};
const origin={x:0,z:0,yaw:0};
function buildStudy(){
  shapes.length=0;vesselShapes(origin,true,true);
  const hull=[[-3.9,-15.5],[3.9,-15.5],[5,-12.4],[5,8.99],[3.9,13.02],[0,15.5],[-3.9,13.02],[-5,8.99],[-5,-12.4]];

  shapes.push({ps:hull.map(([x,z])=>[x,-2.4,z]),fill:'#38564b',edge:'#789985'});
  for(const x of [-2.3,2.3]){
    const ring=Array.from({length:16},(_,i)=>[x+1.05*Math.cos(i*Math.PI/8),-10.3+1.05*Math.sin(i*Math.PI/8)]);
    prism(origin,ring,-4.5,-2.4,'#829c84','#536f5e','#c1d5ab');

function tugLine(g,a,b,col,w=1){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}

      g.strokeStyle='#e1b77e';g.beginPath();g.arc(...a,5,0,Math.PI*2);g.stroke();

  tugText(g,q<.74?'护舷传递推靠力，缓冲接触。':'回转改变推力方向；箭头为示意。',14,352,12,'#d5ddca');
  tugText(g,'ASD / CONCEPT GEOMETRY',14,373,10);
}

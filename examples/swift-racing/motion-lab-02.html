<body><main id="stage"><canvas id="cv"></canvas><div id="grain"></div><div id="start"><span class="sys">SCENEBRIEF / MOTION LAB 02</span><h1>Swift · 从飞行到控制</h1><p>18 秒 / 代表性动态片段 / 无内置字幕</p><button id="go">▶ 播放实验</button></div><div id="controls"><button id="play">▶</button><button id="restart">↺</button><input id="seek" type="range" min="0" max="18" step="0.01" value="0"><span id="time">00:00 / 00:18</span><button id="full">FULL</button></div></main><script type="module">
